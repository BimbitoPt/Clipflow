[package]
name = "clipflow"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clipflow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = "2.0.0-rc.13"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
hound = "3"
ffmpeg-sidecar = "2"

[dev-dependencies]
hound = "3"
ffmpeg-sidecar = "2"
